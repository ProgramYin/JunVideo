services:
  junvideo-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: junvideo-api:latest
    restart: unless-stopped
    init: true
    env_file:
      - .env.domestic-api
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
